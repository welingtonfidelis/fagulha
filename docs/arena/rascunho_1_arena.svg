<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<rect width="1200" height="800" fill="#10191b"/>
<text x="40" y="52" font-size="30" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Rascunho 1 · A Fundição (vista de cima)</text>
<text x="40" y="80" font-size="16" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Uma cratera de fábrica antiga, 140 m de largura. As ondas só começam quando o jogador liga o painel do meio.</text>
