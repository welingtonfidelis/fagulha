<rect x="453" y="349" width="34" height="22" rx="5" fill="#6b7a7e" transform="rotate(360 470 360)"/>
<circle cx="526" cy="658" r="26" fill="#4d8f86" stroke="#59f2d9" stroke-width="2"/>
<circle cx="526" cy="242" r="26" fill="#4d8f86" stroke="#59f2d9" stroke-width="2"/>
<circle cx="470" cy="450" r="30" fill="#1c2a2c" stroke="#59f2d9" stroke-width="4"/><circle cx="470" cy="450" r="10" fill="#59f2d9"/>
<path d="M 430 780 L 444 700 L 496 700 L 510 780 Z" fill="#4c5d52"/>
<rect x="170" y="442" width="70" height="16" fill="#5a4a36"/>
<text x="850" y="128" font-size="20" fill="#ff9e4d" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">O que tem</text>
<rect x="850" y="137" width="18" height="18" rx="4" fill="#59f2d9"/>
<text x="880" y="152" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Painel de partida</text>
<text x="880" y="172" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">liga a próxima onda; desligado, a arena fica em paz</text>
<rect x="850" y="195" width="18" height="18" rx="4" fill="#ff9e4d"/>
<text x="880" y="210" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">4 portões de montagem</text>
<text x="880" y="230" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">os robôs saem montados daqui</text>
<rect x="850" y="253" width="18" height="18" rx="4" fill="#ff5a4d"/>
<text x="880" y="268" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Portão grande</text>
<text x="880" y="288" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">abre só para o minichefe, de 5 em 5 ondas</text>
<rect x="850" y="311" width="18" height="18" rx="4" fill="#6b7a7e"/>
<text x="880" y="326" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Blocos de cobertura</text>
<text x="880" y="346" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">tiro de máquina não passa</text>
<rect x="850" y="369" width="18" height="18" rx="4" fill="#4d8f86"/>
<text x="880" y="384" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Plataformas altas</text>
<text x="880" y="404" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">só voando: lugar de respiro e de tiro de precisão</text>
<rect x="850" y="427" width="18" height="18" rx="4" fill="#4c5d52"/>
<text x="880" y="442" font-size="17" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Rampa de entrada</text>
<text x="880" y="462" font-size="13.5" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">dá para sair a qualquer hora; a onda para</text>
<text x="850" y="516" font-size="20" fill="#ff9e4d" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Uma rodada</text>
<text x="850" y="544" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1. Liga o painel: contagem de 5 s</text>
<text x="850" y="568" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">2. Onda: robôs saem dos portões</text>
<text x="850" y="592" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">3. Todos desligados: 15 s de respiro,</text>
<text x="850" y="616" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">    as peças caídas voam para o robô</text>
<text x="850" y="640" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">4. A cada 5 ondas, o minichefe</text>
<text x="850" y="664" font-size="15" fill="#eceee6" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">5. Vencido o chefe: ponto de volta salvo</text>
<text x="470" y="822" font-size="14" fill="#9db0ab" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">entrada</text>
<text x="470" y="150" font-size="14" fill="#ff8a80" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">portão do minichefe</text>
</svg>