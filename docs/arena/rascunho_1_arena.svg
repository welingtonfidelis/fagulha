<line x1="685" y1="300" x2="638" y2="332" stroke="#ff9e4d" stroke-width="3" stroke-dasharray="4 6"/>
<g transform="translate(470,182)"><rect x="-62" y="-22" width="124" height="44" rx="8" fill="#ff5a4d"/><rect x="-48" y="-12" width="96" height="24" rx="4" fill="#10191b"/></g>
