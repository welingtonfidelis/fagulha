<text x="1445" y="524" font-size="24" fill="#10191b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">L1</text>
<text x="1180" y="650" font-size="18" fill="#eceee6" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">cada toque no L1 passa para a próxima arma</text>
<text x="1180" y="678" font-size="18" fill="#eceee6" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">só aparecem as armas que ele já tem</text>
<text x="1180" y="706" font-size="18" fill="#eceee6" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">a fita surge por 2 s e some sozinha</text>
<text x="1180" y="734" font-size="18" fill="#9db0ab" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">segurar o L1 ainda abre a roda (A), para os maiores</text>
<text x="1180" y="790" font-size="19" fill="#59f2d9" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Sugestão: usar as duas. A criança troca só apertando;</text>
<text x="1180" y="816" font-size="19" fill="#59f2d9" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">quem quiser escolher direto segura e aponta.</text>
