<text x="420" y="832" font-size="17" fill="#9db0ab" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">figura grande e cor do tiro em cada gomo</text>
<text x="420" y="856" font-size="17" fill="#9db0ab" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">o gomo apontado acende e o controle vibra</text>
<text x="420" y="880" font-size="17" fill="#9db0ab" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">arma não fabricada vira um cadeado</text>
<text x="1180" y="140" font-size="24" fill="#ff9e4d" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">B · Toque troca (L1), fita embaixo</text>
<rect x="850" y="190" width="660" height="400" rx="16" fill="#1b2a2c"/>
<rect x="850" y="440" width="660" height="150" fill="#22352f"/>
<text x="1180" y="300" font-size="18" fill="#6f8580" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(o jogo continua, sem câmera lenta)</text>
