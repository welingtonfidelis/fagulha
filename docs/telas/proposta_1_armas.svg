<text x="40" y="54" font-size="34" fill="#eceee6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Seletor de armas · duas propostas</text>
<text x="40" y="86" font-size="18" fill="#9db0ab" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Hoje: seis gomos só com texto pequeno. Proposta: figura grande e cor por arma, e um jeito de trocar que não exige segurar e mirar ao mesmo tempo.</text>
<text x="420" y="140" font-size="24" fill="#ff9e4d" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A · Roda com figuras (segurar L1)</text>
