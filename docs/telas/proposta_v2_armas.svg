<text x="48" y="88" font-size="16" fill="#8fa39e" text-anchor="start" font-weight="300" letter-spacing="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Mesmo visual sóbrio do jogo: painel escuro, traço fino, laranja só na escolha. O que muda é a legibilidade e um atalho de um botão só.</text>
