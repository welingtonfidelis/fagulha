<text x="400" y="518" font-size="14" fill="#8fa39e" text-anchor="middle" font-weight="300" letter-spacing="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">segure e solte</text>
<text x="400" y="808" font-size="15" fill="#8fa39e" text-anchor="middle" font-weight="300" letter-spacing="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">um ícone de traço por arma, com o nome embaixo</text>
<text x="400" y="830" font-size="15" fill="#8fa39e" text-anchor="middle" font-weight="300" letter-spacing="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">a escolha em laranja; o que não foi fabricado, apagado e com cadeado</text>
<text x="400" y="852" font-size="15" fill="#8fa39e" text-anchor="middle" font-weight="300" letter-spacing="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">sem cores por arma, sem figuras cheias</text>
